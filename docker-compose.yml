services:
  db:
    image: postgres:17
    container_name: usage_forecast_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast_local}
      POSTGRES_DB: ${POSTGRES_DB:-forecast}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
